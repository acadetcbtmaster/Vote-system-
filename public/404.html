<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voters Decide</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 path back to index.html with query path
      sessionStorage.redirect = location.href;
      var path = window.location.pathname;
      var repo = path.split('/')[1] ? '/' + path.split('/')[1] + '/' : '/';
      window.location.replace(repo);
    </script>
  </head>
  <body>
    <p>Redirecting to Voters Decide...</p>
  </body>
</html>
